<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="logo scc.jpeg" />
  <title>Share a Smile Charity Club | Laikipia University</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --teal-900: #115e59;
      --teal-700: #0f766e;
      --teal-500: #14b8a6;
      --teal-50: #f0fdfa;
      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --amber-100: #fef3c7;
      --forest-900: #14532d;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --white: #ffffff;
      --danger-bg: #fef2f2;
      --danger-border: #ef4444;
      --danger-text: #991b1b;
      --success-bg: #ecfdf5;
      --success-border: #10b981;
      --success-text: #065f46;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 14px 34px rgba(15, 23, 42, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --inst-navy: var(--teal-900);
      --inst-navy-dark: var(--teal-900);
      --inst-slate: var(--slate-900);
      --inst-muted: var(--slate-600);
      --inst-border: var(--slate-300);
      --inst-border-light: var(--slate-200);
      --inst-bg: var(--slate-50);
      --inst-surface: #ffffff;
      --inst-accent: var(--teal-700);
      --inst-gold: #92400e;
      --inst-gold-bg: var(--amber-100);
      --inst-ok-bg: var(--success-bg);
      --inst-ok-border: var(--success-border);
      --inst-ok-text: var(--success-text);
      --inst-err-bg: #fef2f2;
      --inst-err-border: #ef4444;
      --inst-err-text: #991b1b;
    }

    html {
      scroll-behavior: smooth;
    }

    section[id] {
      scroll-margin-top: 76px;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      line-height: 1.6;
      color: var(--slate-800);
      background-color: var(--slate-50);
      background-image:
        linear-gradient(rgba(248, 250, 252, 0.92), rgba(248, 250, 252, 0.92)),
        url('logo scc.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    /* Sticky Navigation */
    .sas-navbar {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
      padding: 10px 20px;
    }

    .sas-nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .sas-nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--teal-700);
      font-weight: 800;
      font-size: 1.05rem;
    }

    .sas-nav-brand img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--teal-500);
    }

    .sas-nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .sas-nav-links a {
      text-decoration: none;
      color: var(--slate-700);
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.15s ease;
    }

    .sas-nav-links a:hover {
      color: var(--teal-700);
    }

    .sas-nav-portal {
      background: var(--slate-900);
      color: var(--white) !important;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.84rem !important;
    }

    .sas-nav-portal:hover {
      background: var(--teal-700);
    }

    .sas-nav-donate {
      background: var(--teal-700);
      color: var(--white) !important;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.84rem !important;
    }

    .sas-nav-donate:hover {
      background: var(--teal-900);
    }

    /* Announcement & Meeting Banners */
    .sas-highlight-bar {
      background: linear-gradient(90deg, var(--forest-900), #1b5e20);
      color: var(--white);
      padding: 11px 16px;
      border-bottom: 3px solid var(--amber-500);
    }

    .sas-highlight-content {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
      font-size: 0.9rem;
      text-align: center;
    }

    .sas-highlight-tag {
      background-color: #dc2626;
      color: var(--white);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.8px;
    }

    .sas-highlight-btn {
      background-color: var(--amber-500);
      color: var(--slate-900);
      font-weight: 700;
      border: none;
      cursor: pointer;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      transition: background-color 0.15s ease;
    }

    .sas-highlight-btn:hover {
      background-color: #fbbf24;
    }

    .sas-meeting-banner {
      background: linear-gradient(90deg, var(--amber-100), #fde68a);
      color: #78350f;
      padding: 10px 16px;
      border-bottom: 2px solid var(--amber-500);
    }

    .sas-meeting-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 14px;
      font-size: 0.88rem;
      text-align: center;
    }

    .sas-bell-icon {
      font-size: 1.15rem;
      display: inline-block;
      animation: sasBellRing 2.4s ease-in-out infinite;
      transform-origin: top center;
    }

    @keyframes sasBellRing {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(15deg); }
      20% { transform: rotate(-14deg); }
      30% { transform: rotate(10deg); }
      40% { transform: rotate(-8deg); }
      50% { transform: rotate(0deg); }
    }

    .sas-meeting-cta {
      background-color: var(--teal-700);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 16px;
    }

    .sas-meeting-cta:hover {
      background-color: var(--teal-900);
    }

    /* Hero */
    .hero {
      background: linear-gradient(rgba(15, 118, 110, 0.82), rgba(17, 94, 89, 0.86)),
                  url('outreach.jpg') center/cover no-repeat;
      color: var(--white);
      text-align: center;
      padding: 86px 20px;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4.5vw, 3rem);
      font-weight: 800;
      margin-bottom: 14px;
      line-height: 1.18;
    }

    .hero p {
      max-width: 680px;
      margin: 0 auto 28px;
      font-size: 1.08rem;
      color: #f0fdfa;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      background-color: var(--amber-500);
      color: var(--slate-900);
      font-weight: 700;
      padding: 11px 22px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background-color: var(--amber-600);
      color: var(--white);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--white);
      border: 2px solid var(--white);
    }

    .btn-outline:hover {
      background-color: var(--white);
      color: var(--teal-700);
    }

    .btn-teal {
      background-color: var(--teal-700);
      color: var(--white);
    }

    .btn-teal:hover {
      background-color: var(--teal-900);
      color: var(--white);
    }

    .btn-dark {
      background-color: var(--slate-900);
      color: var(--white);
    }

    .btn-dark:hover {
      background-color: var(--slate-700);
      color: var(--white);
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 0.84rem;
    }

    /* Impact Strip */
    .impact-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      max-width: 1120px;
      margin: -34px auto 0;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .impact-card {
      background: var(--white);
      padding: 20px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      text-align: center;
      border-bottom: 4px solid var(--teal-500);
    }

    .impact-value {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--teal-700);
      line-height: 1.2;
    }

    .impact-label {
      font-size: 0.88rem;
      color: var(--slate-600);
      font-weight: 600;
      margin-top: 4px;
    }

    /* Page Sections */
    .page-section {
      max-width: 1120px;
      margin: 0 auto;
      padding: 56px 20px;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 32px;
    }

    .section-heading h2 {
      color: var(--teal-700);
      font-size: clamp(1.55rem, 3vw, 2.05rem);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .section-heading p {
      max-width: 680px;
      margin: 0 auto;
      color: var(--slate-600);
      font-size: 0.98rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--slate-200);
      border-top: 4px solid var(--teal-500);
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      display: block;
      background: var(--slate-100);
    }

    .card-body {
      padding: 20px;
      flex: 1;
    }

    .card-body h3 {
      color: var(--teal-900);
      font-size: 1.12rem;
      margin-bottom: 8px;
    }

    .card-body p {
      color: var(--slate-600);
      font-size: 0.93rem;
    }

    /* Membership Lookup */
    .verify-card {
      max-width: 640px;
      margin: 0 auto;
      background: var(--white);
      padding: 32px 26px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      text-align: center;
      border-top: 5px solid var(--forest-900);
      border-left: 1px solid var(--slate-200);
      border-right: 1px solid var(--slate-200);
      border-bottom: 1px solid var(--slate-200);
    }

    .verify-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 18px;
    }

    .verify-row input {
      flex: 1;
      min-width: 220px;
      padding: 11px 14px;
      font-size: 0.98rem;
      border: 2px solid var(--slate-300);
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      font-weight: 600;
    }

    .verify-row input:focus {
      outline: none;
      border-color: var(--teal-700);
    }

    .verify-result {
      margin-top: 18px;
      padding: 15px;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      text-align: left;
    }

    /* Donate Box */
    .contribute-box {
      max-width: 700px;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--success-bg), var(--teal-50));
      border: 2px solid var(--teal-500);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .mpesa-badge {
      display: inline-block;
      background-color: #16a34a;
      color: var(--white);
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .mpesa-number {
      font-size: 1.95rem;
      font-weight: 800;
      color: var(--teal-900);
      margin: 8px 0;
    }

    /* Join Form */
    .form-box {
      max-width: 580px;
      margin: 0 auto;
      background: var(--white);
      padding: 28px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--slate-200);
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: var(--slate-700);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--slate-300);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--white);
      color: var(--slate-800);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--teal-700);
    }

    /* Executive Governance Portal */
    .sas-portal-wrapper {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-top: 6px solid var(--slate-900);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 28px 24px;
    }

    .sas-portal-top-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--slate-200);
    }

    .sas-portal-title-group h3 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--slate-900);
    }

    .sas-portal-title-group p {
      font-size: 0.88rem;
      color: var(--slate-600);
    }

    .sas-portal-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sas-role-pill {
      background: var(--teal-50);
      color: var(--teal-900);
      border: 1px solid #99f6e4;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .sas-auth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 24px;
      align-items: start;
    }

    .sas-panel {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .sas-panel h4 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 6px;
    }

    .sas-panel-sub {
      font-size: 0.85rem;
      color: var(--slate-600);
      margin-bottom: 16px;
    }

    .sas-roster-list {
      display: grid;
      gap: 8px;
      max-height: 410px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .sas-roster-item {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.84rem;
    }

    .sas-roster-pos {
      font-weight: 800;
      color: var(--teal-700);
      font-size: 0.76rem;
      text-transform: uppercase;
    }

    .sas-roster-name {
      font-weight: 700;
      color: var(--slate-900);
    }

    .sas-roster-meta {
      font-size: 0.78rem;
      color: var(--slate-600);
    }

    .sas-desk-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
    }

    @media (max-width: 820px) {
      .sas-desk-layout {
        grid-template-columns: 1fr;
      }
    }

    .sas-desk-sidebar {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 16px;
      height: fit-content;
    }

    .sas-locked-badge {
      display: inline-block;
      background: var(--slate-900);
      color: var(--white);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sas-nav-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--slate-700);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      margin-bottom: 6px;
      transition: all 0.15s ease;
    }

    .sas-nav-btn:hover {
      background: var(--slate-200);
      color: var(--slate-900);
    }

    .sas-nav-btn.active {
      background: var(--teal-700);
      color: var(--white);
    }

    .sas-desk-main {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .sas-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .sas-kpi {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-sm);
      padding: 14px;
    }

    .sas-kpi-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--slate-600);
    }

    .sas-kpi-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-top: 3px;
    }

    .sas-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 16px;
    }

    .sas-card h4 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 10px;
    }

    .sas-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-sm);
      background: var(--slate-50);
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .sas-table-wrap {
      overflow-x: auto;
    }

    .sas-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      background: var(--white);
    }

    .sas-table th,
    .sas-table td {
      border: 1px solid var(--slate-200);
      padding: 8px 10px;
      text-align: left;
    }

    .sas-table th {
      background: var(--slate-100);
      font-weight: 700;
      color: var(--slate-900);
    }

    /* Modals */
    .sas-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .sas-modal-backdrop.open {
      display: flex;
    }

    .sas-modal-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      border-top: 5px solid var(--slate-900);
    }

    .sas-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--slate-200);
    }

    .sas-close-x {
      background: var(--slate-100);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      color: var(--slate-900);
    }

    .sas-hidden {
      display: none !important;
    }

    .alert-box {
      padding: 12px 14px;
